name: 특정이슈 증빙자료 목록 자동 생성

# 특정이슈증빙/<관리번호>/ 폴더에 파일을 올리고 Push하면
# 증빙자료 목록 파일(특정이슈증빙/_manifest.json)을 자동으로 다시 만듭니다.
# → 시설관리 대시보드가 GitHub API(사용량 제한 있음) 대신 이 목록 파일을 읽어
#   회사 공용 인터넷 등 어떤 환경에서도 증빙자료가 항상 표시됩니다.
on:
  push:
    branches: [ main ]
    paths:
      - '특정이슈증빙/**'
      - 'INDEX.html'                          # 처음 설치(붙여넣기) Push에서도 목록이 만들어지도록
      - '.github/workflows/evid-manifest.yml'
  workflow_dispatch:   # 수동 실행 버튼도 제공

permissions:
  contents: write

concurrency:
  group: evid-manifest
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 증빙자료 목록 생성
        run: |
          python3 - << 'PY'
          import os, json
          base = '특정이슈증빙'
          files = []
          if os.path.isdir(base):
              for root, _, fs in os.walk(base):
                  for f in fs:
                      if f in ('.gitkeep', '_manifest.json'):
                          continue
                      p = os.path.join(root, f).replace(os.sep, '/')
                      files.append(p)
          files.sort()
          os.makedirs(base, exist_ok=True)
          with open(base + '/_manifest.json', 'w', encoding='utf-8') as fp:
              json.dump({'files': files}, fp, ensure_ascii=False, indent=0)
          print(len(files), '개 파일 목록 생성 완료')
          PY

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name  "evid-manifest-bot"
          git config user.email "evid-manifest-bot@users.noreply.github.com"
          git add 특정이슈증빙/_manifest.json
          if git diff --cached --quiet; then
            echo "변경 없음 - 커밋 생략"
          else
            git commit -m "auto: 특정이슈 증빙자료 목록 갱신 [skip ci]"
            git push
          fi
