<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Squarespace Style Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand-wrap">
        <button class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="mainNav">
          <span></span><span></span><span></span>
        </button>
        <a class="brand" href="#" aria-label="Squarespace Home">SQUARESPACE</a>
      </div>

      <nav class="top-nav" id="mainNav" aria-label="Main navigation">
        <a href="#">PRODUCTS</a>
        <a href="#">TEMPLATES</a>
        <a href="#">RESOURCES</a>
      </nav>

      <div class="auth">
        <a href="#" class="login">LOG IN</a>
        <a href="#" class="cta">GET STARTED</a>
      </div>
    </header>

    <main class="hero">
      <section class="categories">
        <h1>Online Store</h1>
        <h2>Local Business</h2>
        <h2 class="active">Portfolio <span aria-hidden="true">→</span></h2>
        <h2>Blog</h2>
        <h2>Restaurant</h2>
        <h2>Services</h2>
        <h2>Personal &amp; CV</h2>

        <a href="#" class="explore-link">EXPLORE ALL TEMPLATES <span>→</span></a>
      </section>

      <section class="showcase" aria-label="Portfolio preview">
        <div class="showcase-header">
          <p class="title">KEVIN MATSUYA</p>
          <div class="tabs">
            <a href="#">Overview</a>
            <a href="#">People</a>
            <a href="#">Things</a>
            <a href="#">Contact</a>
          </div>
        </div>

        <div class="grid">
          <article class="item large"><img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" alt="Beach scene" /></article>
          <article class="item tall"><img src="https://images.unsplash.com/photo-1496449903678-68ddcb189a24?auto=format&fit=crop&w=800&q=80" alt="Friends walking" /></article>
          <article class="item tall"><img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=700&q=80" alt="Portrait in black and white" /></article>
          <article class="item"><img src="https://images.unsplash.com/photo-1473116763249-2faaef81ccda?auto=format&fit=crop&w=700&q=80" alt="Mountain landscape" /></article>
          <article class="item wide"><img src="https://images.unsplash.com/photo-1510942201312-84e7962f4f7a?auto=format&fit=crop&w=900&q=80" alt="Architecture pattern" /></article>
          <article class="item"><img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=700&q=80" alt="Woman portrait" /></article>
          <article class="item"><img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=700&q=80" alt="Coffee being poured" /></article>
        </div>
      </section>
    </main>

    <script src="main.js"></script>
  </body>
</html>
